<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Versão impressa · Código Delas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/impressao.css">
</head>
<body>
  <header class="barra-controle">
    <div>
      <strong>Versão impressa · Código Delas</strong>
      <p>Escolha o que imprimir. Cada item começa em uma nova página. Dica: imprima em A4, sem margens extras do navegador.</p>
      <p id="aviso-url"></p>
    </div>
    <fieldset>
      <label><input type="checkbox" data-secao="qr" checked> Cartazes com QR Code</label>
      <label><input type="checkbox" data-secao="pistas" checked> Pistas impressas (contingência)</label>
      <label><input type="checkbox" data-secao="gabarito" checked> Gabarito das monitoras</label>
      <label><input type="checkbox" data-secao="mestra" checked> Planilha mestra</label>
    </fieldset>
    <button id="imprimir">Imprimir</button>
  </header>

  <main id="paginas"></main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/conteudo.js"></script>
  <script src="assets/js/vendor/qrcode.js"></script>
  <script src="assets/js/comum.js"></script>
  <script src="assets/js/paginas/impressao.js"></script>
</body>
</html>
